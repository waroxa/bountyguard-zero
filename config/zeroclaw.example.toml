schema_version = 3

[providers.models.openai.default]
model = "gpt-5.4"
wire_api = "responses"
requires_openai_auth = true
temperature = 0.1
max_tokens = 1200

[agents.bountyguard]
model_provider = "openai.default"
risk_profile = "bountyguard"
runtime_profile = "bountyguard"
skill_bundles = ["bountyguard"]

[agents.bountyguard.identity]
format = "openclaw"

[risk_profiles.bountyguard]
level = "supervised"
workspace_only = true
allowed_commands = ["python3"]
require_approval_for_medium_risk = false
block_high_risk_commands = true
auto_approve = ["bountyguard__scan_finalized_payouts", "sop_status", "sop_advance"]
always_ask = ["file_write", "file_edit", "shell"]
allowed_tools = ["bountyguard__scan_finalized_payouts", "sop_execute", "sop_status", "sop_advance", "sop_approve", "memory_store"]

[runtime_profiles.bountyguard]
agentic = true
max_tool_iterations = 4
max_actions_per_hour = 20
max_cost_per_day_cents = 0
shell_timeout_secs = 45
parallel_tools = false
strict_tool_parsing = true

[runtime_profiles.bountyguard.tool_receipts]
enabled = true
show_in_response = true
inject_system_prompt = true

[channels]
cli = true

[sop]
sops_dir = "sops"
default_execution_mode = "supervised"
step_scope_enforce = true
step_schema_enforce = true
persist_runs = true

[skill_bundles]

[skill_bundles.bountyguard]
